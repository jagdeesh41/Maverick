steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    dir: 'bankchain-project/bankchain-backend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-backend:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-backend:latest'
      - '.'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    dir: 'bankchain-project/bankchain-frontend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-frontend:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-frontend:latest'
      - '.'

  # Push backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-backend'

  # Push frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-frontend'

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hackathon-backend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-backend:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hackathon-cwa'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-frontend:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-backend:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-backend:latest'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-frontend:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/hackathon/hackathon-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
