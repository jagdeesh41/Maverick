version: '3.8'
services:
  CWA_POSTGRES:
    image: postgres:15-alpine
    container_name: CWA_DB
    restart: always
    environment:
      POSTGRES_DB: cwa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Kolkata        # Correct timezone
    ports:
      - "54321:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - CWA_data:/var/lib/postgresql/data

