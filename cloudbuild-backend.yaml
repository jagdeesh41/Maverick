steps:
  # Run backend tests first - if any test fails, the build stops here and
  # nothing gets built/pushed/deployed. Previously this pipeline had no
  # test gate at all: a failing test would still ship.
  - name: 'maven:3.9-eclipse-temurin-17'
    id: 'backend-tests'
    dir: 'bankchain-project/bankchain-backend'
    args: ['mvn', '-B', 'test']

  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build-backend'
    dir: 'bankchain-project/bankchain-backend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/maverick/backend:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/maverick/backend:latest'
      - '.'

  # Push backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-to-gar'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/maverick/backend'

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend-to-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/maverick/backend:$SHORT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/maverick/backend:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/maverick/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
