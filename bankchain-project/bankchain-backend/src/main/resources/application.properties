spring.application.name=bankchain-backend

# ---- H2 (in-memory) -----
# No separate database server needed. The schema is created fresh from
# the entity classes every time the app starts (ddl-auto=create-drop),
# so there's no drift between code and schema to ever go wrong again -
# no DROP/CREATE DATABASE step, no version mismatch, nothing to forget.
# Trade-off: data resets on every restart - DataSeeder re-seeds it every
# time, which is exactly what you want for a demo/dev loop like this.
spring.datasource.url=jdbc:h2:mem:bankchain_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 web console - inspect tables directly in a browser while the
# backend is running, at http://localhost:8080/h2-console
# JDBC URL to paste in: jdbc:h2:mem:bankchain_db
# Username: sa / Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


app.seed.enabled=true

# ---- Google Cloud Storage (proof photo uploads) ----
# Every "proof" upload (asset proof, KYC photo, transferee ID, death
# certificate, recovery/inheritance documents) goes to this bucket via
# GcsFileService instead of being stored as base64 in H2 - only the
# returned object key is persisted. The bucket is private ("Not public"),
# so reads go through short-lived V4 signed URLs, never a public link.
# Uses Application Default Credentials - works out of the box in Cloud
# Shell/GCE/Cloud Run; for local dev run `gcloud auth application-default
# login` first. Signing itself needs the active identity to be able to
# sign as a service account (roles/iam.serviceAccountTokenCreator on
# itself) - google-cloud-storage calls the IAM Credentials API's signBlob
# under the hood since ADC on GCE/Cloud Shell has no local private key.
gcs.project-id=${GCUL_PROJECT_ID:ltc-hack2026-team13}
gcs.bucket-name=maverick_gcs
gcs.signed-url-ttl-minutes=15

# Proof photos are a few MB at most (FileUpload.jsx caps at ~4MB client-side)
# - Spring Boot's default 1MB multipart limit is too small for these.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ---- Observability ----
# http://localhost:8080/actuator/health  -> {"status":"UP"} (or DOWN, e.g. if the DB is unreachable)
# http://localhost:8080/actuator/metrics -> JVM memory, request counts/latency, etc.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# ---- Real Universal Ledger (GCUL) integration ----
# Inactive by default (MockGCULAdapter handles LedgerService instead).
# Set spring.profiles.active=gcul on a host that has Docker + gcloud
# installed and already authenticated, with the bank's operator aliases
# (contract-owner, mavericks-account-manager, etc.) registered in
# ~/.config/ul-cli/config.yaml - see smart-contracts/gcul/DEPLOY.md.
# ul-cli itself is not a real binary here - it's a `docker run` alias
# (see `type ul-cli`), so GculProcessRunner invokes this image directly.
gcul.ul-cli.image=us-docker.pkg.dev/gcul-artifacts/images/client/ul-cli:latest
gcul.workdir=./smart-contracts/gcul
gcul.timeout-seconds=45
gcul.contract.bin-path=bankchain_asset.bin
gcul.contract.owner-alias=contract-owner
gcul.account-manager.alias=mavericks-account-manager
gcul.gcp.project-id=${GCUL_PROJECT_ID:}
gcul.kms.keyring=bankchain-ledger-keys
gcul.kms.location=global

# ---- Gemini virtual assistant (Bank Chain Assistant chat widget) ----
# Get a key from https://aistudio.google.com/apikey - set it via the
# GEMINI_API_KEY environment variable, never paste it directly here.
# Blank key -> chat falls back to a static "contact your RM" message
# instead of failing (see GeminiAssistantService).
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.5-flash
