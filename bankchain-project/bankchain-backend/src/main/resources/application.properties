spring.application.name=bankchain-backend
server.port=8081

# ---- H2 (in-memory) ----
# No separate database server needed. The schema is created fresh from
# the entity classes every time the app starts (ddl-auto=create-drop),
# so there's no drift between code and schema to ever go wrong again -
# no DROP/CREATE DATABASE step, no version mismatch, nothing to forget.
# Trade-off: data resets on every restart - DataSeeder re-seeds it every
# time, which is exactly what you want for a demo/dev loop like this.
spring.datasource.url=jdbc:h2:mem:bankchain_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 web console - inspect tables directly in a browser while the
# backend is running, at http://localhost:8081/h2-console
# JDBC URL to paste in: jdbc:h2:mem:bankchain_db
# Username: sa / Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Seed data toggle ----
app.seed.enabled=true
